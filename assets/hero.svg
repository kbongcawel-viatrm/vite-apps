<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="vite-ide hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- aurora blobs -->
  <ellipse cx="180" cy="80" rx="260" ry="160" fill="url(#aurora1)" opacity="0.55" filter="url(#glow)"/>
  <ellipse cx="1020" cy="360" rx="300" ry="180" fill="url(#aurora2)" opacity="0.5" filter="url(#glow)"/>
  <ellipse cx="620" cy="-40" rx="220" ry="140" fill="#38bdf8" opacity="0.25" filter="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 350 H1200 M0 280 H1200 M0 210 H1200 M0 140 H1200 M0 70 H1200"/>
    <path d="M200 0 V420 M400 0 V420 M600 0 V420 M800 0 V420 M1000 0 V420"/>
  </g>

  <!-- floating code chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" filter="url(#glow)">
    <rect x="90" y="120" width="150" height="52" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="112" y="153" font-size="20" fill="#c4b5fd">&lt;/&gt;</text>
    <rect x="950" y="90" width="170" height="52" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#67e8f9" stroke-opacity="0.5"/>
    <text x="972" y="123" font-size="18" fill="#67e8f9">npm run dev</text>
    <rect x="880" y="300" width="180" height="52" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="902" y="333" font-size="18" fill="#f9a8d4">:18080 🔒</text>
  </g>

  <!-- title -->
  <text x="600" y="205" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#ffffff">vite<tspan fill="url(#code)">-ide</tspan></text>
  <text x="600" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#c7d2fe">VS Code in the browser — hardened, proxied, one command away</text>

  <!-- port pills -->
  <g font-family="ui-monospace, monospace" font-size="15">
    <rect x="430" y="300" width="90" height="34" rx="17" fill="#7f5af0" opacity="0.9"/>
    <text x="475" y="322" text-anchor="middle" fill="#fff">:5173 UI</text>
    <rect x="540" y="300" width="110" height="34" rx="17" fill="#0ea5e9" opacity="0.9"/>
    <text x="595" y="322" text-anchor="middle" fill="#fff">:8080 edge</text>
    <rect x="670" y="300" width="130" height="34" rx="17" fill="#10b981" opacity="0.9"/>
    <text x="735" y="322" text-anchor="middle" fill="#fff">:18080 code</text>
  </g>
</svg>
