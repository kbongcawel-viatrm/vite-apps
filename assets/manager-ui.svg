<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-label="vite-apps management UI mockup">
  <defs>
    <linearGradient id="pagebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5fb"/><stop offset="100%" stop-color="#e8ebf7"/>
    </linearGradient>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f7f8fd"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f5af0"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="760" height="560" fill="url(#pagebg)"/>
  <!-- ambient blobs -->
  <circle cx="90" cy="80" r="140" fill="#7f5af0" opacity="0.10"/>
  <circle cx="680" cy="480" r="160" fill="#0ea5e9" opacity="0.10"/>
  <circle cx="640" cy="90" r="90" fill="#f472b6" opacity="0.08"/>

  <!-- browser chrome -->
  <rect x="60" y="48" width="640" height="464" rx="14" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="60" y="48" width="640" height="38" rx="14" fill="#eef0f8"/>
  <rect x="60" y="70" width="640" height="16" fill="#eef0f8"/>
  <circle cx="86" cy="67" r="6" fill="#f87171"/><circle cx="106" cy="67" r="6" fill="#fbbf24"/><circle cx="126" cy="67" r="6" fill="#34d399"/>
  <!-- url bar -->
  <rect x="150" y="57" width="420" height="20" rx="10" fill="#ffffff" stroke="#dfe3f0"/>
  <text x="166" y="71" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">localhost:5173</text>
  <rect x="586" y="57" width="96" height="20" rx="10" fill="#e2e8f0"/>
  <text x="596" y="71" font-family="ui-monospace, monospace" font-size="10" fill="#475569">manager</text>

  <!-- card -->
  <rect x="160" y="120" width="440" height="356" rx="16" fill="url(#cardbg)" stroke="#e6e9f5" stroke-width="1.5"/>

  <text x="380" y="170" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="#1e1b4b">vite-apps</text>
  <text x="380" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Secure code-server manager</text>

  <!-- status rows -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14">
    <text x="196" y="244" fill="#475569">Status</text>
    <rect x="480" y="228" width="88" height="26" rx="13" fill="#10b981"/>
    <text x="524" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">running</text>

    <text x="196" y="288" fill="#475569">PID</text>
    <text x="480" y="288" font-family="ui-monospace, monospace" font-size="13" fill="#334155">35250</text>

    <text x="196" y="332" fill="#475569">Workspace</text>
    <text x="480" y="332" font-family="ui-monospace, monospace" font-size="12" fill="#334155">…/vite-apps/workspace</text>

    <text x="196" y="376" fill="#475569">Editor</text>
    <text x="480" y="376" font-family="ui-monospace, monospace" font-size="13" fill="#7f5af0">localhost:8080 ↗</text>
  </g>
  <g stroke="#eef0f8" stroke-width="1.5">
    <path d="M196 258 H564 M196 302 H564 M196 346 H564"/>
  </g>

  <!-- buttons -->
  <rect x="196" y="410" width="150" height="42" rx="10" fill="url(#primary)"/>
  <text x="271" y="436" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Stop</text>
  <rect x="360" y="410" width="120" height="42" rx="10" fill="#eef0f8" stroke="#dfe3f0"/>
  <text x="420" y="436" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">Refresh</text>

  <!-- hint -->
  <rect x="196" y="468" width="368" height="2" fill="#eef0f8"/>
  <text x="196" y="492" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">The editor runs behind a hardened local proxy: password auth,</text>
  <text x="196" y="508" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">security headers, and login rate limiting.</text>

  <!-- floating editor chip -->
  <g transform="rotate(6 640 120)">
    <rect x="560" y="80" width="170" height="52" rx="12" fill="#ffffff" stroke="#7f5af0" stroke-opacity="0.5" filter="url(#shadow)"/>
    <circle cx="582" cy="106" r="9" fill="#10b981"/>
    <text x="600" y="111" font-family="ui-monospace, monospace" font-size="12" fill="#1e1b4b">editor :8080</text>
  </g>
</svg>
