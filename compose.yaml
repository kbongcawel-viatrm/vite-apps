# # Unified edge deployment & file-manager stack (rootless Podman)
#
# ROOTLESS ONLY: run podman-compose as your normal user — never via sudo.
#   podman-compose up -d
#   podman-compose down
#
#  New Network flow:
# ##################################################################################################################################################################################################################
# |  Container                              │ Listen address      │ Public hostname           │ Notes                                                      │   Run as
# ├─────────────────────────────────────────┼─────────────────────┼───────────────────────────┼────────────────────────────────────────────────────────────┤────────────────────────────────────────────────────────
# | vite-apps_dufs_1        (Container)     | 127.0.0.1:5050->5000|  files.home-security.uk   | dufs file manager                                          |  podman-compose -f compose.yaml
# │ vite-apps_caddy_1       (Container)     │ 127.0.0.1:8443      │  N/A                      │ tls manager and reverse proxy                              │  podman-compose -f compose.yaml 
# │ vite-apps_cloudflared_1 (Container)     │ N/A                 │  *.home-security.uk       │ CF tunnel                                                  │  podman-compose -f compose.yaml 
# ##################################################################################################################################################################################################################

name: vite-apps

x-podman:
  in_pod: false

services:
  caddy:
    image: docker.io/library/caddy:2
    pull_policy: never
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    network_mode: host
    restart: unless-stopped
    depends_on:
      - dufs
    volumes:
      - ./workspace/caddy/deploy/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    network_mode: host
    restart: unless-stopped
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "cloudflared", "--metrics", "127.0.0.1:20241", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dufs:
    image: localhost/vite-apps_dufs:latest
    init: true
    stop_grace_period: 2s
    build:
      context: ./workspace/file-manager
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    ports:
      - "127.0.0.1:5050:5000"
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    environment:
      - FTP_HOST=192.168.1.58
      - FTP_PORT=21
    env_file:
      - ./workspace/file-manager/.env
    volumes:
      - ./workspace/file-manager/assets:/assets:ro,Z
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  podman-health:
    image: localhost/vite-apps_podman-health:latest
    init: true
    stop_grace_period: 2s
    build:
      context: ./workspace/podman-health
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    security_opt:
      - label=disable
    volumes:
      - /run/user/1000/podman/podman.sock:/run/podman.sock
    healthcheck:
      test: ["CMD", "python3", "-c", "import glob, os, sys; sys.exit(0 if any(os.path.exists(p) and b'podman_health' in open(p,'rb').read() for p in glob.glob('/proc/[0-9]*/cmdline')) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  suricata-cf-block:
    image: docker.io/jasonish/suricata@sha256:d5a3a1785299ab40918d465e54fedf8e3afeeedba76bb64b0cc74dbc20bda2c3
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    security_opt:
      - label=disable
    env_file:
      - ../suricata-cf/cf.env
    environment:
      - IPS_EVE=/logs/suricata-logs/eve.json
      - IDS_EVE=/logs/suricata-ids-logs/eve.json
      - STATE_FILE=/var/lib/suricata-cf-block/cf-block-state.json
    volumes:
      - ../suricata-cf/suricata-cf-block.py:/opt/suricata-cf-block.py:ro
      - ../suricata-cf/data:/var/lib/suricata-cf-block
      - /var/lib/containers/storage/volumes/suricata-logs/_data:/logs/suricata-logs:ro
      - /var/lib/containers/storage/volumes/suricata-ids-logs/_data:/logs/suricata-ids-logs:ro
    entrypoint: ["python3", "/opt/suricata-cf-block.py"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "suricata-cf-block.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  caddy_data:
  caddy_config:
