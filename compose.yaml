# # Unified edge deployment & file-manager stack (rootless Podman)
#
# ROOTLESS ONLY: run podman-compose as your normal user — never via sudo.
#   podman-compose up -d
#   podman-compose down
#
#  New Network flow:
# ##################################################################################################################################################################################################################
# |  Container                              │ Listen address      │ Public hostname           │ Notes                                                      │   Run as
# ├─────────────────────────────────────────┼─────────────────────┼───────────────────────────┼────────────────────────────────────────────────────────────┤────────────────────────────────────────────────────────
# | vite-apps_dufs_1        (Container)     | 127.0.0.1:5050->5000|  files.home-security.uk   | dufs file manager                                          |  podman-compose -f compose.yaml
# │ vite-apps_caddy_1       (Container)     │ 127.0.0.1:8443      │  N/A                      │ tls manager and reverse proxy                              │  podman-compose -f compose.yaml 
# │ vite-apps_cloudflared_1 (Container)     │ N/A                 │  *.home-security.uk       │ CF tunnel                                                  │  podman-compose -f compose.yaml 
# ##################################################################################################################################################################################################################
name: vite-apps

services:
  caddy:
    image: docker.io/library/caddy:2
    pull_policy: never
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    network_mode: host
    restart: unless-stopped
    depends_on:
      - dufs
    volumes:
      - ./workspace/caddy/deploy/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy admin API on localhost:2019 proves the process is serving.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Serves https://127.0.0.1:8443 for ide./manager./files.home-security.uk

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    network_mode: host
    restart: unless-stopped
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run
    env_file:
      - ./.env   # repo-root .env containing TUNNEL_TOKEN
    healthcheck:
      # Queries the local metrics /ready endpoint; exits non-zero until
      # the tunnel has registered connections to Cloudflare edge.
      test: ["CMD", "cloudflared", "--metrics", "127.0.0.1:20241", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dufs:
    image: localhost/vite-apps_dufs:latest
    build:
       context: ./workspace/file-manager
       dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    ports:
      - "127.0.0.1:5050:5000"
    # FUSE mount for rclone; SYS_ADMIN is namespaced under rootless podman.
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    environment:
      - FTP_HOST=10.1.29.1
      - FTP_PORT=21
    env_file:
      - ./workspace/file-manager/.env
    volumes:
      # Vendored dufs UI assets (adds Access logout link); :Z for SELinux.
      - ./workspace/file-manager/assets:/assets:ro,Z
    healthcheck:
      # dufs serves on :5000 inside the container; TCP connect is enough —
      # the UI may answer 401/redirect depending on auth config.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  podman-health:
    image: localhost/vite-apps_podman-health:latest
    build:
       context: ./workspace/podman-health
       dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    security_opt:
      # Unconfined so container_t can connect to the host podman socket
      # (user_tmp_t) — uid mapping already gives it host uid 1000.
      - label=disable
    volumes:
      # Host rootless podman socket file: `podman ps` inside sees all
      # user containers. Mounted as a file, not the dir (dir perms block it).
      - /run/user/1000/podman/podman.sock:/run/podman.sock
    healthcheck:
      # Liveness = the agent script is PID 1's cmdline.
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0 if b'podman_health' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
