  podman-health:
    build: ./workspace/podman_health
    pull_policy: never
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    security_opt:
      # Unconfined so container_t can connect to the host podman socket
      # (user_tmp_t) — uid mapping already gives it host uid 1000.
      - label=disable
    volumes:
      # Host rootless podman socket file: `podman ps` inside sees all
      # user containers. Mounted as a file, not the dir (dir perms block it).
      - /run/user/1000/podman/podman.sock:/run/podman.sock
    healthcheck:
      # Liveness = the agent script is PID 1's cmdline.
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0 if b'podman_health' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
