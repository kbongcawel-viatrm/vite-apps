# vite-apps edge deployment: Caddy (TLS/origin) + cloudflared (Cloudflare Tunnel).
#
# Both services use host networking on purpose: the hardened edge proxy binds
# 127.0.0.1:8080, which is unreachable from a container bridge network.
# Nothing here opens a new public port — cloudflared dials OUT to Cloudflare.
#
# ROOTLESS ONLY: run podman-compose as your normal user — never via sudo.
# scripts/deploy.sh enforces this. (Rootlessness is a podman client property;
# it cannot be expressed in this file, so it is guarded at deploy time.)
#
#   npm run deploy        # build app + start containers detached
#   podman-compose -f workspace/ide/compose.yaml up -d
#   podman-compose -f workspace/ide/compose.yaml down
#
# Tunnel auth: TOKEN mode — set TUNNEL_TOKEN in the repo-root .env (from the
# Cloudflare Zero Trust dashboard). Hostname routing is configured there too.
#
# Per-app segregation: `name` pins the podman-compose project so this app's
# containers (ide_caddy_1, ide_cloudflared_1, volumes) can never collide with
# other apps' tunnels on the same host. Each app gets its own tunnel + token.

name: vite-apps

services:
  caddy:
    image: docker.io/library/caddy:2
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Serves https://127.0.0.1:8443 for ide./manager.home-security.uk

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    network_mode: host
    restart: unless-stopped
    # Token mode: cloudflared reads TUNNEL_TOKEN from the environment.
    # Ingress (public hostnames -> https://localhost:8443) is managed in the
    # Zero Trust dashboard, not in a local config file.
    command: tunnel --no-autoupdate run
    env_file:
      - ../../.env   # repo-root .env (compose resolves relative to this file)

volumes:
  caddy_data:
  caddy_config:
